name: Build and Deploy

on:
  push:
    branches:
      - main

env:
  REGISTRY_URL: registry.digitalocean.com/todo-app

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Container Registry
        run: echo -n ${{ secrets.REGISTRY_PASSWORD }} | docker login ${{ env.REGISTRY_URL }} -u ${{ secrets.REGISTRY_USERNAME }} --password-stdin

      - name: Build Docker image
        run: docker build -f Dockerfile.prod -t ${{ env.REGISTRY_URL }}/todo-app:latest .

      - name: Push Docker image
        run: docker push ${{ env.REGISTRY_URL }}/todo-app:latest

      - name: Deploy to Droplet
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DROPLET_IP }}
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /project
            docker compose pull
            docker compose up -d
